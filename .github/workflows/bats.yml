name: Bats

on:
  push:
    branches: [main]
  pull_request:
    # Every top-level path the suite reads. tests/ci_path_filter.bats derives
    # the list from $KIT_ROOT/<x> references in tests/ and fails if one is
    # missing here — add the path, don't widen the pattern.
    paths:
      - 'bootstrap.sh'
      - 'pull-ticket.sh'
      - 'archive-ticket.sh'
      - 'scripts/**'
      - 'memory-templates/**'
      - 'templates/**'
      - 'examples/**'
      - 'docs/**'
      - '.claude/**'
      - 'tests/**'
      - 'CONVENTIONS.md'
      - 'FEATURES.md'
      - 'PROMPTS.md'
      - 'SETUP.md'
      - '.github/workflows/bats.yml'

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bats + expect
        run: sudo apt-get update && sudo apt-get install -y bats expect

      - name: Configure git (required by bootstrap.sh + tests)
        run: |
          git config --global user.email "bats@example.invalid"
          git config --global user.name "Bats Test Runner"
          git config --global init.defaultBranch main

      - name: Run bats suite (non-interactive)
        run: bats tests/

      - name: Run expect suite (interactive)
        run: tests/interactive/run.sh
